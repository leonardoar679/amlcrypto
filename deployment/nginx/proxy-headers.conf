# What every proxied location sends upstream. Install as /etc/nginx/aml/proxy-headers.conf (the path
# aml.conf.example includes). See aml.conf.example for what it is for.

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# This proxy is the first hop, so what a client sent in X-Forwarded-For is a claim, not a fact. It
# is overwritten, not appended to, with the address nginx saw: the API then finds the client's
# address by counting back one proxy (TRUSTED_PROXY_HOPS=1) and cannot be told a different one.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# One id for the request in nginx's log, the API's log and the audit log (the API accepts ids of
# 8 to 64 letters, digits, dots, dashes and underscores; $request_id is 32 hex characters).
proxy_set_header X-Request-ID $request_id;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 120s;
proxy_hide_header X-Powered-By;
