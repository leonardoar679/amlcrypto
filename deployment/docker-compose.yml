# CI builds the image and checks that this file parses (job docker-build); it has not been started
# on the development machine, which has no Docker.
# Usage:  docker compose -f deployment/docker-compose.yml --env-file deployment/.env up --build
# The web app and the API each publish a port on the loopback address only; deployment/nginx has the
# reverse proxy that is meant to be the way anyone reaches them (TLS, rate limits, body limits).
# With it in front, set TRUSTED_PROXY_HOPS=1 so that the audit log records the person's address.
x-aml-environment: &aml-environment
  ENVIRONMENT: prod
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deployment/.env (32+ random characters)}
  DATABASE_URL: ${DATABASE_URL:-sqlite:////data/aml.db}
  # Provider keys are optional; a blank one means "not configured".
  ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
  ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
  TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
  HELIUS_API_KEY: ${HELIUS_API_KEY:-}
  # Alchemy's Address Activity webhook may call POST /api/v1/webhooks/alchemy once this is set (blank:
  # the endpoint answers 404). It only brings a monitored address's next check forward.
  ALCHEMY_WEBHOOK_SIGNING_KEY: ${ALCHEMY_WEBHOOK_SIGNING_KEY:-}
  # How many reverse proxies in front of the API add to X-Forwarded-For (for the audit log's client
  # address and the sign-in lockout's bookkeeping). 0 trusts only the connection's own address.
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
  # A second opinion on sanctions. Watchman has no authentication, so it is reachable only from
  # inside this compose project (it publishes no port); an empty value turns the second opinion off.
  WATCHMAN_URL: ${WATCHMAN_URL-http://watchman:8084}

services:
  api:
    build:
      context: ../apps/api
    image: aml-api
    environment: *aml-environment
    volumes:
      - aml-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # The web app: the pages, and the proxy that carries the signed-in person's requests to the API (a
  # browser never reaches the API, and never holds its token). It reads BACKEND_URL when it starts, and
  # it has no secret of its own: not the API's SECRET_KEY, not a provider key.
  web:
    build:
      context: ../apps/web
      args:
        # The public address of the site once there is one (https://example.org): the Atom feed's links and
        # ids are made from it. The framework reads it when the app is built, so changing it means building
        # the image again. Blank: the feed is made on the address it is asked on, and is not shared by caches.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    image: aml-web
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  # Same image as the API. It waits for the API because the API's start-up applies the migrations.
  # With SQLite keep exactly one worker: the limits it enforces live in the process.
  worker:
    image: aml-api
    command: ["python", "-m", "app.worker"]
    environment: *aml-environment
    volumes:
      - aml-data:/data
    depends_on:
      api:
        condition: service_healthy
    # WORKER_SHUTDOWN_GRACE_SECONDS (20) plus time to hand unfinished jobs back.
    stop_grace_period: 30s
    restart: unless-stopped

  # Moov Watchman: screens against sanctions lists over HTTP. Its API is UNAUTHENTICATED BY DESIGN,
  # so it must never get a `ports:` entry; only the api and worker reach it, by name. It needs
  # outbound access to download the lists, so the network is not marked internal.
  # The image tag follows the latest release (v1.2.2) and has not been pulled on the development
  # machine; INCLUDED_LISTS is set explicitly because the docs do not say OFAC is loaded by default.
  watchman:
    image: moov/watchman:v1.2.2
    environment:
      INCLUDED_LISTS: us_ofac
    restart: unless-stopped

volumes:
  aml-data:
