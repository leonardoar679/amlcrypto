name: CI

on:
  push:
  pull_request:

# Workflow logs need a GitHub login to read. Failed tests are therefore also written as annotations
# (apps/api/scripts/annotate_junit.py), which show on the run page and through the public checks API.

jobs:
  api-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt
      - run: pip install -c constraints.txt -e ".[dev,mysql]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=pytest-report.xml
      - name: Annotate failures
        if: failure()
        run: python scripts/annotate_junit.py pytest-report.xml

  # Runs the same suite against a real MySQL. Each test is rolled back (see tests/conftest.py).
  # 8.0 reached end of life in April 2026; 8.4 is the current LTS.
  api-mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "8.4"]
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aml_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/aml_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt
      - run: pip install -c constraints.txt -e ".[dev,mysql]"
      - run: pytest -q --junitxml=pytest-report.xml
      - name: Annotate failures
        if: failure()
        run: python scripts/annotate_junit.py pytest-report.xml

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      # The unit tests of the proxy's rules and of the pure code the pages are built from.
      - run: npm test
      - run: npm run build
      # The frontend began as a copy of a commercial site; fail if its names ever come back.
      # (Terms are listed in shared/documentation/branding-ip-register.md.)
      - name: No third-party brand strings
        run: |
          if grep -rniIE 'btrace|bholder|bitok|amlcrypto|amlcheck|willkie|everscan|freeton|skolkovo|vedomosti|kommersant|\bmir\b' . \
              --exclude-dir=node_modules --exclude-dir=.next --exclude=package-lock.json; then
            echo "third-party brand strings found"; exit 1
          fi

  # Docker is not installed on the development machine, so the image is built and smoke-tested here.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the API image
        run: docker build -t aml-api:ci apps/api
      - name: Run it and call the public endpoints
        run: |
          secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run -d --name aml-api -p 8000:8000 -e ENVIRONMENT=prod -e SECRET_KEY="$secret" aml-api:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/version
      - name: Run the worker on a job that needs no network
        # PROVIDER_PROBE for a provider without a key finishes without any request leaving the
        # runner, so this exercises migrate, enqueue and the worker without a flaky dependency.
        run: |
          secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          out="$(docker run --rm -e ENVIRONMENT=prod -e SECRET_KEY="$secret" \
            -e PAYLOAD='{"provider":"etherscan"}' aml-api:ci sh -c \
            'python -m app.cli migrate >/dev/null && python -m app.cli enqueue PROVIDER_PROBE --payload "$PAYLOAD" && python -m app.worker --once 2>/dev/null')"
          echo "$out"
          echo "$out" | grep -q "Processed 1 job(s)."
      - name: Container logs on failure
        if: failure()
        run: |
          logs="$(docker logs aml-api 2>&1 | tail -40)"
          logs="${logs//'%'/'%25'}"; logs="${logs//$'\n'/'%0A'}"
          echo "::error title=aml-api container logs::${logs}"
      - name: Validate the compose file
        run: SECRET_KEY=ci-check docker compose -f deployment/docker-compose.yml config -q
