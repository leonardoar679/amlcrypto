name: CI

on:
  push:
  pull_request:

jobs:
  api-sqlite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt
      - run: pip install -c constraints.txt -e ".[dev,mysql]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # Runs the same suite against a real MySQL 8. Each test is rolled back (see tests/conftest.py).
  api-mysql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aml_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/aml_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/constraints.txt
      - run: pip install -c constraints.txt -e ".[dev,mysql]"
      - run: pytest -q
